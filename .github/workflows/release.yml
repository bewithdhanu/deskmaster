name: Build and Release

# Disabled: duplicate of "Build and Release DeskMaster" (build.yml).
# Multiple release:published workflows raced uploading the same DMGs (422 already_exists).
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React apps
        run: npm run build-react

      - name: Build Electron app (unsigned)
        run: npm run dist-ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds-${{ github.event.release.tag_name || github.ref_name }}
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Debug - List downloaded files
        run: |
          echo "Downloaded artifacts:"
          find . -name "*.dmg" -o -name "*.blockmap" | head -20

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            **/*.dmg
            **/*.dmg.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
